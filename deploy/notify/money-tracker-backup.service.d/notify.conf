# /etc/systemd/system/money-tracker-backup.service.d/notify.conf (prazo-pi)
# Alerting layer, kept out of the main unit (same pattern as mbsync-gmail's notify.conf).
[Unit]
OnFailure=notify-failure@%n.service

[Service]
# Only after a successful dump: "✅ recovered" if the last run had failed.
# "+" = as root, so it can switch from postgres to mike; "-" = never fails the backup.
ExecStartPost=-+/usr/sbin/runuser -u mike -- /usr/bin/env HOME=/home/mike PATH=/home/mike/bin:/usr/bin:/bin /home/mike/bin/notify-unit-ok %n
