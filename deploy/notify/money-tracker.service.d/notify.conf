# /etc/systemd/system/money-tracker.service.d/notify.conf (prazo-pi)
# Alerting layer, kept out of the main unit (same pattern as mbsync-gmail's notify.conf).
# Every failed start/crash triggers OnFailure= (systemd 257, also while Restart=
# retries); notify-unit-failure sends at most one alert per 6 h. After 5 failed
# starts in 10 min the unit stays failed. The next healthy start sends "✅ recovered".
[Unit]
OnFailure=notify-failure@%n.service

[Service]
# Runs after the main unit's /health readiness check passed: "✅ recovered" if the
# unit had been marked failed. "+" = as root, outside this unit's User=/sandbox,
# so it can switch to mike; "-" = an alerting problem never fails the service.
ExecStartPost=-+/usr/sbin/runuser -u mike -- /usr/bin/env HOME=/home/mike PATH=/home/mike/bin:/usr/bin:/bin /home/mike/bin/notify-unit-ok %n
